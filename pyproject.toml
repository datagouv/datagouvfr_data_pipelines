    "dbt-postgres==1.10.0",  # not used in this repo (from data-engineering-stack)
    "duckdb==1.4.1",
    "emails==0.6",
    "faust-cchardet==2.1.19",  # not used in this repo (from data-engineering-stack)
    "feedgen==1.0.0",
    "frictionless==5.18.0",
    "geojson==3.2.0",
    "geopandas==1.1.3",  # not used in this repo (from data-engineering-stack)
    "geoparquet-io==0.2.0",
    "gitpython==3.1.27",
    "ipykernel==6.29.5",  # Jupyter kernel used by papermill to run the notebooks
