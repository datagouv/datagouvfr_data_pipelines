# Values read by hand in the original publications of the Ministère de l'Intérieur,
# checked against the produced files at each run of the DAG (task check_outputs):
# a mismatch fails the run before anything is sent or published.
#
# - table: general or candidats
# - filtres: the columns selecting the rows (id_election is required)
# - either valeurs: the columns to check on the single row selected (a case matching
#   no row or several rows is an error)
# - or agregats: per column, aggregates over all the rows selected (e.g. a department):
#   somme, moyenne, min, max, nombre (of non-empty values)
# - source: where the value was read (file, URL, sheet, line)
#
# Numbers are compared at the precision written here (98.72 → 2 decimals).
#
# Quote the codes, otherwise YAML reads them as numbers: "01", "01001_0001".
#
# - table: candidats
#   filtres:
#     id_election: "1992_sena_t1"
#     id_brut_miom: "37"
#     nom: "LECLERC"
#   valeurs:
#     voix: 441
#   source: "Sénatoriales 1992, fichier xls du MinInt, onglet …, ligne …"
#
# - table: general
#   filtres:
#     id_election: "2022_pres_t1"
#     code_departement: "37"
#   agregats:
#     inscrits:
#       somme: 450123
#     ratio_votants_inscrits:
#       moyenne: 78.12
#   source: "Présidentielle 2022 T1, résultats par département, Indre-et-Loire"

