---
version: 2.1

executors:
  uv:
    docker:
      - image: ghcr.io/astral-sh/uv:python3.12-trixie

jobs:
  lint:
    executor: uv
    # mypy is invoked by name (datagouvfr_data_pipelines) from the pre-commit
    # hook; its parent is on the search path via `mypy_path = $MYPY_CONFIG_FILE_DIR/..`.
    # The checkout must keep the package directory name and live under that parent.
    working_directory: ~/dags/datagouvfr_data_pipelines
    steps:
      - checkout
      - run:
          name: Install dependencies and run all hooks
          command: |
            # Runtime dependencies + dev group (at the versions of uv.lock): the
            # mypy hook runs from this virtualenv (`language: system`), so the
            # runtime dependencies must be installed for their types to be
            # visible. ruff runs in its own isolated pre-commit environment.
            uv sync --locked
            uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  test:
    executor: uv
    # pytest.ini adds the parent directory ("..") to sys.path so tests can use
    # absolute imports (datagouvfr_data_pipelines...). The checkout must keep
    # the package directory name and live under that parent.
    working_directory: ~/dags/datagouvfr_data_pipelines
    steps:
      - checkout
      - run:
          name: Install dependencies and run all tests
          command: |
            uv sync --locked
            uv run --no-sync pytest -v

  dag-imports:
    executor: uv
    # DAGs use absolute imports (datagouvfr_data_pipelines...), so the checkout
    # must keep the package directory name and its parent must be on PYTHONPATH,
    # like in production where the repo is mounted under the DAGs folder.
    working_directory: ~/dags/datagouvfr_data_pipelines
    steps:
      - checkout
      - run:
          name: Install dependencies
          # Runtime dependencies only, as in the Airflow image.
          command: uv sync --locked --no-dev
      - run:
          name: Check DAG import errors
          command: |
            . .venv/bin/activate
            # `airflow dags list-import-errors` parses local DAGs and exits
            # non-zero as soon as at least one file fails to import.
            export AIRFLOW_HOME="$HOME/airflow"
            export AIRFLOW__CORE__DAGS_FOLDER="$HOME/dags"
            export AIRFLOW__CORE__LOAD_EXAMPLES=False
            export PYTHONPATH="$HOME/dags${PYTHONPATH:+:$PYTHONPATH}"
            # Values normally provided by Airflow Variables in production.
            # Synthetic placeholders only: never put real secrets in CI.
            export AIRFLOW_VAR_AIRFLOW_DAG_HOME="$HOME/dags/"
            export AIRFLOW_VAR_DATAGOUV_SECRET_API_KEY="test-key"
            airflow db migrate
            airflow dags list-import-errors -l

workflows:
  check:
    jobs:
      - lint
      - test
      - dag-imports
