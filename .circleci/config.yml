---
version: 2.1

parameters:
  python-version:
    type: string
    default: "3.12"

jobs:
  lint:
    docker:
      - image: cimg/python:<< pipeline.parameters.python-version >>
    steps:
      - checkout
      - run:
          name: Install ruff and check linting
          # ruff check . : check linting and imports sorting without fixing (to fix, use --fix)
          # ruff format --check . : check code formatting without fixing (to fix, remove --check)
          command: |
            python -m venv .venv
            . .venv/bin/activate
            pip install --upgrade pip
            # version alignée sur .pre-commit-config.yaml : sans borne haute, une
            # nouvelle version de ruff élargit les règles par défaut et met la CI
            # au rouge sur du code qui n'a pas bougé
            pip install ruff==0.15.20
            ruff --version
            ruff check .
            ruff format --check .

  test:
    docker:
      - image: cimg/python:<< pipeline.parameters.python-version >>
    steps:
      - checkout
      - run:
          name: Install dependencies and run tests
          command: |
            python -m venv .venv
            . .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt pytest
            pytest -v data_processing/dvf/geoloc/tests/

  dag-imports:
    docker:
      - image: cimg/python:<< pipeline.parameters.python-version >>
    # DAGs use absolute imports (datagouvfr_data_pipelines...), so the checkout
    # must keep the package directory name and its parent must be on PYTHONPATH,
    # like in production where the repo is mounted under the DAGs folder.
    working_directory: ~/dags/datagouvfr_data_pipelines
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m venv .venv
            . .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Check DAG import errors
          command: |
            . .venv/bin/activate
            # `airflow dags list-import-errors` parses local DAGs and exits
            # non-zero as soon as at least one file fails to import.
            export AIRFLOW_HOME="$HOME/airflow"
            export AIRFLOW__CORE__DAGS_FOLDER="$HOME/dags"
            export AIRFLOW__CORE__LOAD_EXAMPLES=False
            export PYTHONPATH="$HOME/dags${PYTHONPATH:+:$PYTHONPATH}"
            # Values normally provided by Airflow Variables in production.
            # Synthetic placeholders only: never put real secrets in CI.
            export AIRFLOW_VAR_AIRFLOW_DAG_HOME="$HOME/dags/"
            export AIRFLOW_VAR_DATAGOUV_SECRET_API_KEY="test-key"
            airflow db migrate
            airflow dags list-import-errors -l

workflows:
  check:
    jobs:
      - lint
      - test
      - dag-imports
