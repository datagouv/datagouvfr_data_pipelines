# mypy configuration.
#
# Single source of truth for mypy options. The pre-commit hook
# (.pre-commit-config.yaml) no longer passes any rule-altering `args`;
# everything lives here.

[mypy]
python_version = 3.12
explicit_package_bases = true
# The repository root is the datagouvfr_data_pipelines package: mypy is invoked
# on the package by name (`-p datagouvfr_data_pipelines`), and the package
# parent must be on the search path for internal `from datagouvfr_data_pipelines...`
# imports to resolve. $MYPY_CONFIG_FILE_DIR is expanded by mypy relative to this
# config file, so these paths work no matter where mypy is invoked from.
mypy_path = $MYPY_CONFIG_FILE_DIR/..
# Keep the cache inside the repo (no need to touch the package parent).
cache_dir = $MYPY_CONFIG_FILE_DIR/.mypy_cache

# Third-party libraries that ship no type information (no stubs, no `py.typed`).
# Typing on OUR code stays strict: only these external imports are unchecked.
# A trailing `.*` matches the package and all its submodules.
#
# The mypy hook runs from the project virtualenv, so installed dependencies are
# resolved and type-checked normally. The sections for libraries that do ship
# `py.typed` (e.g. numpy, pandas, pydantic) are therefore legacy leftovers from
# the former isolated hook env and are being removed one by one. Each remaining
# section silences "cannot find implementation or library stub" for a library
# that has no stubs; new such imports must be added here explicitly.
[mypy-airflow.*]
ignore_missing_imports = True

[mypy-airflow_client.*]
ignore_missing_imports = True

[mypy-aiohttp.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

