# mypy configuration.
#
# Single source of truth for mypy options. The pre-commit hook
# (.pre-commit-config.yaml) no longer passes any rule-altering `args`;
# everything lives here.

[mypy]
python_version = 3.12
explicit_package_bases = true
install_types = true
non_interactive = true

# Lenient options still in use. They are removed one by one, as the errors
# they mask get fixed (see #856):
#   - ignore_missing_imports: internal imports (datagouvfr_data_pipelines.*)
#     need the package parent on the mypy path; external libs (pandas,
#     dateutil, datagouv, boto3, airflow, ...) need types-* stubs or
#     per-module ignores (see #800 for the packaging move).
ignore_missing_imports = true
