repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: debug-statements
      - id: check-ast
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.15.20'  # Ruff version
    hooks:
      - id: ruff-check
        # I: import sorting; D: docstring format, except the rules that
        # require a docstring to exist (D100-D107), which the codebase does
        # not enforce.
        args: [--fix, --extend-select, "I,D", --ignore, "D100,D101,D102,D103,D104,D105,D106,D107"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.1.0'
    hooks:
      - id: mypy
        # All mypy options live in mypy.ini (single source of truth).
        args: []
        additional_dependencies: [tokenize-rt==3.2.0, 'types-requests',
                                  'types-psutil', 'types-redis']
