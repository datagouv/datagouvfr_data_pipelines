repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: debug-statements
      - id: check-ast
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.15.20'  # Ruff version
    hooks:
      - id: ruff-check
        # Ruff configuration (rules, style) lives in ruff.toml, so that
        # `ruff check .` on the command line behaves exactly like this hook.
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.1.0'
    hooks:
      - id: mypy
        # All mypy options live in mypy.ini (single source of truth).
        args: []
        additional_dependencies: [tokenize-rt==3.2.0, 'types-requests',
                                  'types-psutil', 'types-redis']
