[pytest]
# Several test files are named test_task_functions.py in different folders.
# importlib mode imports each by its full path, avoiding module-name clashes.
# All warnings are promoted to errors so any deprecation (e.g. pandas setting
# an item of incompatible dtype) fails the run in CI and locally instead of
# being silently logged.
addopts = --import-mode=importlib -W error
# The repository is the datagouvfr_data_pipelines namespace package: its parent
# must be importable for `from datagouvfr_data_pipelines... import ...`.
pythonpath = ..
# Only these directories are collected by a bare `pytest`. Add any new test
# directory here (e.g. schema/ if tests are added under schema/), otherwise it
# will be silently ignored.
testpaths = data_processing dgv utils meta
